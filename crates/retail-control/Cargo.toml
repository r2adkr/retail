[package]
name = "retail-control"
description = "retail coordination server (embedded in retaild): node registry, IP allocation, netmaps, relay, STUN"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
retail-proto.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
tracing.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
futures-util.workspace = true
socket2 = "0.6.5"
ring = "0.17"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
