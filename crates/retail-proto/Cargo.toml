[package]
name = "retail-proto"
description = "Wire types shared by the retail control server, daemon and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_IO", "Win32_System_RemoteDesktop", "Win32_System_Threading"] }
tokio = { workspace = true }
