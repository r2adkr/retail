<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>retail 서버 관리</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2328;--dim:#646c76;--line:#e6e8ec;--accent:#2563eb;--accent-soft:#eef3fe;--ok:#1a7f37;--warn:#9a6700;--warn-soft:#fff8e5;--bad:#cf222e;--chip:#f0f2f5;--pop:#fff;--shadow:0 6px 24px #0002}
@media(prefers-color-scheme:dark){:root{--bg:#16181d;--card:#1f2228;--text:#e6e8eb;--dim:#9aa1aa;--line:#2e333b;--accent:#3b82f6;--accent-soft:#1d2a44;--ok:#3fb950;--warn:#d29922;--warn-soft:#2b2412;--bad:#f85149;--chip:#2a2e36;--pop:#262a31;--shadow:0 6px 24px #0008}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;word-break:keep-all}
main{max-width:820px;margin:0 auto;padding:24px 16px 56px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
h1{font-size:20px;margin:0;font-weight:650}
.head{display:flex;align-items:center;justify-content:space-between;margin:28px 4px 10px}
h2{font-size:13px;color:var(--dim);margin:0;font-weight:600}
.pill{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--dim);white-space:nowrap;font-weight:400}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 18px}
.card.pad{padding:16px 18px}
.rows{display:grid;grid-template-columns:130px 1fr;gap:8px 16px;margin:0 0 12px}
.rows dt{color:var(--dim)}.rows dd{margin:0;overflow-wrap:anywhere}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;margin:0 0 12px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:6px 12px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;line-height:1.4}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.danger{color:var(--bad)!important}
button:disabled{opacity:.5;cursor:default}
.icon{padding:6px 10px;letter-spacing:1px}
.item{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.main{flex:1 1 200px;min-width:0}
.name{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta{color:var(--dim);font-size:12.5px;margin-top:2px}
.side{display:flex;align-items:center;gap:6px;margin-left:auto}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa1aa}
.dot.on{background:var(--ok)}
.muted{color:var(--dim)}
.small{font-size:12.5px}
.empty{color:var(--dim);padding:14px 0}
details.menu{position:relative}
details.menu>summary{list-style:none}
details.menu>summary::-webkit-details-marker{display:none}
.pop{position:absolute;right:0;top:calc(100% + 4px);z-index:5;background:var(--pop);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:180px}
.pop a,.pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;color:var(--text);text-decoration:none}
.pop a:hover,.pop button:hover{background:var(--chip)}
.pop .sub{color:var(--dim)}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--dim);border-radius:8px;padding:7px 10px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px #0002}
.field{display:grid;gap:6px;margin:14px 0}
.field label{font-size:12.5px;color:var(--dim)}
.field input{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:8px 10px;outline:none}
.field input:focus{border-color:var(--accent)}
.code{font:12px ui-monospace,Consolas,monospace;background:var(--chip);padding:8px 10px;border-radius:9px;overflow-wrap:anywhere;max-height:96px;overflow:auto}
.share{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.share .qr{width:148px;height:148px;background:#fff;border-radius:10px;padding:6px;flex:none}
.share .qr svg{width:100%;height:100%;display:block}
.share .text{flex:1 1 200px;min-width:0;display:grid;gap:8px}
.files{display:grid;gap:8px;margin:12px 0}
.file{display:flex;align-items:center;justify-content:space-between;gap:10px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:#0006}
dialog h3{margin:0 0 4px;font-size:17px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:9px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
@media(max-width:560px){.rows{grid-template-columns:1fr;gap:0}.rows dd{margin-bottom:10px}}
</style>
</head>
<body>
<main>
<header><h1>retail 서버 관리</h1><span id="state" class="pill">…</span></header>
<section id="server"></section>
<div id="networked" hidden>
<div class="head"><h2>초대</h2><button class="primary" onclick="openCreate()">초대 만들기</button></div>
<div class="card"><div id="invites"></div></div>
<div class="head"><h2>기기</h2><span id="count" class="muted small"></span></div>
<div class="card"><div id="nodes"></div></div>
<p id="meshNote" class="muted small" style="margin:10px 4px 0"></p>
</div>
</main>

<dialog id="createDlg"><div id="createBody"></div></dialog>
<dialog id="shareDlg"><h3 id="shareTitle"></h3><p class="muted small" style="margin:0 0 14px">휴대폰으로 찍거나, 코드를 복사해 상대 기기의 retail 설정에 붙여 넣으세요.</p><div class="share" id="shareBody"></div><div class="actions"><button onclick="$('#shareDlg').close()">닫기</button></div></dialog>
<dialog id="uploadDlg"><div id="uploadBody"></div></dialog>
<div id="toast" class="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let view=null,invites=[],nodes=[];
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),2400)}
async function api(path,body){
  const r=await fetch(path,body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json","X-Retail-Web":"1"},body:JSON.stringify(body)});
  if(r.headers.get("content-type")?.includes("svg"))return r.text();
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||("오류 "+r.status));
  return j;
}
async function act(path,body,msg){closeMenus();try{const j=await api(path,body??{});if(msg)toast(msg);await load(true);return j}catch(e){toast(e.message)}}
function copy(t){navigator.clipboard?.writeText(t).then(()=>toast("복사했습니다"),()=>prompt("복사하세요",t))}
function closeMenus(except){document.querySelectorAll("details.menu[open]").forEach(d=>{if(d!==except)d.open=false})}
document.addEventListener("click",e=>{if(!e.target.closest("details.menu"))closeMenus()});
document.addEventListener("toggle",e=>{if(e.target.matches?.("details.menu")&&e.target.open)closeMenus(e.target)},true);
const menu=(label,items,cls="")=>`<details class="menu"><summary class="btn ${cls}" aria-label="${label==="⋯"?"더 보기":esc(label)}">${label}</summary><div class="pop">${items}</div></details>`;
function expires(t){if(t>=9e18)return"만료 없음";const h=Math.round((t-Date.now()/1000)/3600);return h<=0?"만료됨":h<48?h+"시간 뒤 만료":Math.round(h/24)+"일 뒤 만료"}
function ago(t){if(!t)return"접속 기록 없음";const m=Math.floor((Date.now()/1000-t)/60);return m<1?"방금 접속":m<60?m+"분 전 접속":m<1440?Math.floor(m/60)+"시간 전 접속":Math.floor(m/1440)+"일 전 접속"}
function routerText(r){if(!r)return"자동 열기 꺼짐";return r.kind==="opened"?`${r.method}로 열림 (TCP ${r.tcp}, UDP ${r.udp})`:"자동으로 열지 못함"}
function noticeText(n){if(!n)return"";if(n.kind==="cgnat")return`공유기의 외부 주소(${n.router_ip})가 사설 주소입니다(CGNAT). 다른 네트워크의 기기는 보조 노드 없이 이 서버에 접속할 수 없고, 같은 네트워크의 기기는 참여할 수 있습니다.`;return`공유기가 포트를 자동으로 열지 않았습니다. 다른 네트워크의 기기가 접속하려면 공유기에서 TCP ${n.tcp}와 UDP ${n.udp}를 이 컴퓨터로 포트포워딩하거나 도메인을 지정하세요.`}
async function shareBlock(code){let svg="";try{svg=await api("/api/qr",{text:code})}catch{}return`<div class="qr">${svg}</div><div class="text"><div class="code">${esc(code)}</div><div><button onclick="copy(this.closest('.text').querySelector('.code').textContent)">코드 복사</button></div></div>`}
async function showShare(title,code){closeMenus();$("#shareTitle").textContent=title;$("#shareBody").innerHTML=await shareBlock(code);$("#shareDlg").showModal()}

function render(){
  const s=view.server;
  $("#state").textContent=s.running?"실행 중":"꺼짐";$("#state").className="pill"+(s.running?" on":"");
  if(!s.running){
    $("#server").innerHTML=`<div class="card pad"><p style="margin-top:0">이 기기에서 네트워크 서버가 꺼져 있습니다. 켜면 이 기기가 서버가 되고, 초대로 다른 기기를 들일 수 있습니다.</p>${s.last_error?`<div class="notice">${esc(s.last_error)}</div>`:""}<button class="primary" onclick="act('/api/server/start',{},'서버를 켰습니다')">서버 켜기</button></div>`;
    $("#networked").hidden=true;return;
  }
  const rows=[["밖에서 접속할 주소",s.public||"다른 네트워크에서는 접속할 수 없음"],["이 네트워크",(s.lan||[]).slice(0,3).join(", ")||"-"],["공유기 포트",routerText(s.router)]];
  if(s.reality)rows.push(["REALITY",`켜짐 · ${s.reality}처럼 보임`]);
  if(s.helper)rows.push(["보조 노드",`${s.helper} · ${s.helper_linked?"연결됨":"연결 안 됨"}`]);
  if((s.fronts||[]).length)rows.push(["CDN",s.fronts.join(", ")]);
  const notice=noticeText(s.notice);
  $("#server").innerHTML=`<div class="card pad"><dl class="rows">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>${notice?`<div class="notice">${esc(notice)}</div>`:""}<button class="danger" onclick="if(confirm('서버를 끄면 모든 기기의 연결이 끊깁니다. 기기 등록은 남아서, 다시 켜면 이어집니다.'))act('/api/server/stop',{},'서버를 껐습니다')">서버 끄기</button></div>`;
  $("#networked").hidden=false;

  // Named invites first, then single-use ones still open, newest first
  const now=Date.now()/1000;
  invites=(s.invites||[]).filter(i=>i.name||(i.expires_at>now&&(!i.used||i.reusable))).sort((a,b)=>(!!b.name)-(!!a.name)||b.id-a.id);
  const clients=view.clients||[];
  $("#invites").innerHTML=invites.length?invites.map((i,k)=>{
    if(!i.name){
      const kind=i.reusable?"재사용 초대":"1회용 초대";
      return`<div class="item"><div class="main"><div class="name">${kind} <span class="pill">#${i.id}</span></div><div class="meta">${i.reusable?i.uses+"대 참여":"아직 쓰이지 않음"} · ${expires(i.expires_at)} · 코드는 만들 때만 볼 수 있음</div></div>
      <div class="side">${menu("⋯",`<button class="danger" onclick="revoke(${k})">만료</button>`,"icon")}</div></div>`;
    }
    const dl=clients.map(c=>c.missing.length?`<button class="sub" onclick="openUpload('${esc(c.id)}')">${esc(c.label)}: 파일 올리기…</button>`:`<a href="/download/${i.id}/${encodeURIComponent(c.id)}" onclick="closeMenus();toast('설치 파일을 만드는 중입니다')">${esc(c.label)}용</a>`).join("");
    return`<div class="item"><div class="main"><div class="name">${esc(i.name)}</div><div class="meta">여러 기기용 · ${i.uses}대 참여 · ${expires(i.expires_at)}</div></div>
    <div class="side">${menu("받기 ▾",dl)}${menu("⋯",`<button onclick="codeOf(${k},'qr')">코드·QR 보기</button><button onclick="codeOf(${k},'copy')">코드 복사</button><button onclick="regen(${k})">새 코드 만들기</button><button class="danger" onclick="revoke(${k})">만료</button>`,"icon")}</div></div>`}).join(""):`<div class="empty">아직 초대가 없습니다. <b>초대 만들기</b>로 시작하세요.</div>`;

  nodes=(s.nodes||[]).slice().sort((a,b)=>(view.own_ip===b.ip)-(view.own_ip===a.ip)||b.online-a.online||a.hostname.localeCompare(b.hostname));
  const online=nodes.filter(n=>n.online).length;
  $("#count").textContent=nodes.length?`${nodes.length}대 중 ${online}대 연결`:"";
  $("#nodes").innerHTML=nodes.length?nodes.map((n,k)=>{const self=view.own_ip===n.ip;const allowed=view.admins.includes(n.id);
    return`<div class="item"><div class="main"><div class="name"><span class="dot${n.online?" on":""}"></span>${esc(n.hostname)}${self?'<span class="pill">이 기기</span>':""}${n.exit_node?'<span class="pill">Exit node</span>':""}${allowed&&!self?'<span class="pill on">관리 허용</span>':""}</div>
    <div class="meta">${esc(n.ip)} · ${esc(n.os)} · ${n.online?"연결됨":ago(n.last_seen)}</div></div>
    ${self?"":`<div class="side">${menu("⋯",`<button onclick="setAdmin(${k},${!allowed})">${allowed?"관리 허용 끄기":"이 기기에서 관리 허용"}</button><button class="danger" onclick="removeNode(${k})">기기 제거</button>`,"icon")}</div>`}</div>`}).join(""):`<div class="empty">아직 참여한 기기가 없습니다.</div>`;
  $("#meshNote").textContent=view.mesh_url?`관리를 허용한 기기는 retail에 연결된 상태에서 ${view.mesh_url} 로 이 페이지를 열 수 있습니다.`:"";
}
async function load(force){if(!force&&(document.querySelector("details.menu[open]")||document.querySelector("dialog[open]")))return;
  try{view=await api("/api/status");render()}catch(e){$("#server").innerHTML=`<div class="card pad"><div class="notice">${esc(e.message)}</div></div>`}}

async function codeOf(k,how){closeMenus();const i=invites[k];try{const j=await api(`/api/invites/${i.id}/code`,{});how==="qr"?showShare(`${i.name} 초대`,j.code):copy(j.code)}catch(e){toast(e.message)}}
function regen(k){const i=invites[k];if(confirm(`'${i.name}' 초대의 새 코드를 만듭니다. 이전 코드와 그 코드가 든 설치 파일은 더 이상 쓸 수 없고, 이미 참여한 기기는 그대로입니다.`))act("/api/invites",{name:i.name},"새 코드를 만들었습니다")}
function revoke(k){const i=invites[k];if(confirm(`${i.name?`'${i.name}'`:"이"} 초대를 만료합니다. 이미 참여한 기기는 그대로입니다.`))act(`/api/invites/${i.id}/revoke`,{},"만료했습니다")}
function setAdmin(k,allowed){const n=nodes[k];act(`/api/nodes/${n.id}/admin`,{allowed},allowed?`${n.hostname}에서 이 페이지를 열 수 있습니다`:"관리 허용을 껐습니다")}
function removeNode(k){const n=nodes[k];if(confirm(`${n.hostname}을(를) 네트워크에서 제거합니다. 다시 들어오려면 초대가 필요합니다.`))act(`/api/nodes/${n.id}/delete`,{},"기기를 제거했습니다")}

// Creating an invite: one dialog for both kinds
let draft={kind:"multi",ttl:null};
function openCreate(){draft={kind:"multi",ttl:null};drawCreate();$("#createDlg").showModal();setTimeout(()=>$("#cName")?.focus(),50)}
function drawCreate(){
  const multi=draft.kind==="multi";
  const ttls=[[null,"만료 없음"],[168,"7일"],[720,"30일"]];
  $("#createBody").innerHTML=`<h3>초대 만들기</h3><p class="muted small" style="margin:0 0 14px">${multi?"이름을 붙여 여러 기기가 같이 씁니다. 나중에 설치 파일을 받거나 코드를 새로 만들 수 있습니다.":"기기 하나가 24시간 안에 한 번 참여할 수 있습니다."}</p>
  <div class="seg"><button class="${multi?"on":""}" onclick="draft.kind='multi';drawCreate()">여러 기기용</button><button class="${multi?"":"on"}" onclick="draft.kind='once';drawCreate()">1회용</button></div>
  ${multi?`<div class="field"><label for="cName">이름</label><input id="cName" maxlength="40" placeholder="예: 가족" value="${esc(draft.name||"")}" oninput="draft.name=this.value" onkeydown="if(event.key==='Enter')create()"></div>
  <div class="field"><label>만료</label><div class="seg">${ttls.map(([v,l])=>`<button class="${draft.ttl===v?"on":""}" onclick="draft.ttl=${v};drawCreate()">${l}</button>`).join("")}</div></div>`:""}
  <div class="actions"><button onclick="$('#createDlg').close()">취소</button><button class="primary" onclick="create()">만들기</button></div>`;
}
async function create(){
  const multi=draft.kind==="multi";const name=(draft.name||"").trim();
  if(multi&&!name)return toast("이름을 입력하세요");
  if(multi&&(view.server.invites||[]).some(i=>i.name===name)&&!confirm(`'${name}' 초대가 이미 있습니다. 새 코드를 만들면 이전 코드는 쓸 수 없게 됩니다.`))return;
  try{
    const j=await api("/api/invites",multi?{name,ttl_hours:draft.ttl}:{reusable:false});
    await load(true);
    $("#createBody").innerHTML=`<h3>${multi?`'${esc(name)}' 초대를 만들었습니다`:"1회용 초대를 만들었습니다"}</h3><p class="muted small" style="margin:0 0 14px">${multi?"설치 파일은 목록의 <b>받기</b>에서 받을 수 있습니다. ":"이 코드는 지금만 볼 수 있습니다. "}휴대폰으로 찍거나 코드를 복사해 전달하세요.</p><div class="share">${await shareBlock(j.code)}</div><div class="actions"><button class="primary" onclick="$('#createDlg').close()">완료</button></div>`;
  }catch(e){toast(e.message)}
}

// Program files for a client this server lacks (a macOS build, say)
let target=null;
function openUpload(id){closeMenus();target=(view.clients||[]).find(c=>c.id===id);drawUpload();$("#uploadDlg").showModal()}
function drawUpload(){
  const c=target;if(!c)return;
  const files=c.missing.map(f=>`<div class="file"><span>${esc(f)}</span><button onclick="pick('${esc(f)}')">파일 선택</button></div>`).join("");
  $("#uploadBody").innerHTML=`<h3>${esc(c.label)}용 설치 파일 준비</h3><p class="muted small" style="margin:0">이 서버에는 ${esc(c.label)}용 retail 프로그램이 없습니다. ${esc(c.label)}에서 빌드했거나 배포판에서 받은 아래 파일을 올리면, 이후로는 이 서버가 ${esc(c.label)}용 설치 파일을 만들어 줍니다.</p>
  ${c.missing.length?`<div class="files">${files}</div>`:`<p>모든 파일이 준비됐습니다.</p>`}<div class="actions"><button onclick="$('#uploadDlg').close()">${c.missing.length?"닫기":"완료"}</button></div>`;
}
function pick(name){const inp=document.createElement("input");inp.type="file";inp.onchange=()=>inp.files[0]&&send(name,inp.files[0]);inp.click()}
async function send(name,file){
  toast(`${name} 올리는 중…`);
  try{const r=await fetch(`/api/clients/${encodeURIComponent(target.id)}/${encodeURIComponent(name)}`,{method:"POST",headers:{"X-Retail-Web":"1","Content-Type":"application/octet-stream"},body:file});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("오류 "+r.status));
    toast(`${name}을(를) 올렸습니다`);await load(true);target=(view.clients||[]).find(c=>c.id===target.id);drawUpload();
  }catch(e){toast(e.message)}
}
load(true);setInterval(load,5000);
</script>
