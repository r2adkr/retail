<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>retail server</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2328;--dim:#646c76;--line:#e6e8ec;--accent:#2563eb;--accent-soft:#eef3fe;--ok:#1a7f37;--warn:#9a6700;--warn-soft:#fff8e5;--bad:#cf222e;--chip:#f0f2f5;--pop:#fff;--shadow:0 6px 24px #0002}
@media(prefers-color-scheme:dark){:root{--bg:#16181d;--card:#1f2228;--text:#e6e8eb;--dim:#9aa1aa;--line:#2e333b;--accent:#3b82f6;--accent-soft:#1d2a44;--ok:#3fb950;--warn:#d29922;--warn-soft:#2b2412;--bad:#f85149;--chip:#2a2e36;--pop:#262a31;--shadow:0 6px 24px #0008}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Yu Gothic UI","Hiragino Sans","Microsoft YaHei UI","PingFang SC",sans-serif}
html[lang=ko] body{word-break:keep-all}
main{max-width:820px;margin:0 auto;padding:24px 16px 56px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
h1{font-size:20px;margin:0;font-weight:650}
.head{display:flex;align-items:center;justify-content:space-between;margin:28px 4px 10px}
h2{font-size:13px;color:var(--dim);margin:0;font-weight:600}
.pill{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--dim);white-space:nowrap;font-weight:400}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 18px}
.card.pad{padding:16px 18px}
.rows{display:grid;grid-template-columns:130px 1fr;gap:8px 16px;margin:0 0 12px}
.rows dt{color:var(--dim)}.rows dd{margin:0;overflow-wrap:anywhere}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;margin:0 0 12px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:6px 12px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;line-height:1.4}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.danger{color:var(--bad)!important}
button:disabled{opacity:.5;cursor:default}
.icon{padding:6px 10px;letter-spacing:1px}
.item{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.main{flex:1 1 200px;min-width:0}
.name{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta{color:var(--dim);font-size:12.5px;margin-top:2px}
.side{display:flex;align-items:center;gap:6px;margin-left:auto}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa1aa}
.dot.on{background:var(--ok)}
.muted{color:var(--dim)}
.small{font-size:12.5px}
.empty{color:var(--dim);padding:14px 0}
details.menu{position:relative}
details.menu>summary{list-style:none}
details.menu>summary::-webkit-details-marker{display:none}
.pop{position:absolute;right:0;top:calc(100% + 4px);z-index:5;background:var(--pop);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:180px}
.pop a,.pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;color:var(--text);text-decoration:none}
.pop a:hover,.pop button:hover{background:var(--chip)}
.pop .sub{color:var(--dim)}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--dim);border-radius:8px;padding:7px 10px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px #0002}
.field{display:grid;gap:6px;margin:14px 0}
.field label{font-size:12.5px;color:var(--dim)}
.field input{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:8px 10px;outline:none}
.field input:focus{border-color:var(--accent)}
.code{font:12px ui-monospace,Consolas,monospace;background:var(--chip);padding:8px 10px;border-radius:9px;overflow-wrap:anywhere;max-height:96px;overflow:auto}
.share{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.share .qr{width:148px;height:148px;background:#fff;border-radius:10px;padding:6px;flex:none}
.share .qr svg{width:100%;height:100%;display:block}
.share .text{flex:1 1 200px;min-width:0;display:grid;gap:8px}
.files{display:grid;gap:8px;margin:12px 0}
.file{display:flex;align-items:center;justify-content:space-between;gap:10px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:#0006}
dialog h3{margin:0 0 4px;font-size:17px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:9px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
@media(max-width:560px){.rows{grid-template-columns:1fr;gap:0}.rows dd{margin-bottom:10px}}
</style>
</head>
<body>
<main>
<header><h1 data-t>retail server</h1><span id="state" class="pill">…</span></header>
<section id="server"></section>
<div id="networked" hidden>
<div class="head"><h2 data-t>Invites</h2><button class="primary" onclick="openCreate()" data-t>Create invite</button></div>
<div class="card"><div id="invites"></div></div>
<div class="head"><h2 data-t>Devices</h2><span id="count" class="muted small"></span></div>
<div class="card"><div id="nodes"></div></div>
<p id="meshNote" class="muted small" style="margin:10px 4px 0"></p>
</div>
</main>

<dialog id="createDlg"><div id="createBody"></div></dialog>
<dialog id="shareDlg"><h3 id="shareTitle"></h3><p class="muted small" style="margin:0 0 14px" data-t>Scan it with a phone, or copy the code and paste it into retail settings on the other device.</p><div class="share" id="shareBody"></div><div class="actions"><button onclick="$('#shareDlg').close()" data-t>Close</button></div></dialog>
<dialog id="uploadDlg"><div id="uploadBody"></div></dialog>
<div id="toast" class="toast" role="status"></div>

"Create":["만들기","作成","创建","Crear"],
"Enter a name":["이름을 입력하세요","名前を入力してください","请输入名称","Escribe un nombre"],
"An invite named '{name}' already exists. A new code makes the old one unusable.":["'{name}' 초대가 이미 있습니다. 새 코드를 만들면 이전 코드는 쓸 수 없게 됩니다.","「{name}」という招待はすでにあります。新しいコードを作ると以前のコードは使えなくなります。","名为“{name}”的邀请已存在。生成新代码后旧代码将失效。","Ya existe una invitación llamada «{name}». Un código nuevo inutiliza el anterior."],

"One-time invite created":["1회용 초대를 만들었습니다","1 回限りの招待を作成しました","已创建一次性邀请","Invitación de un solo uso creada"],

"Couldn't fetch from GitHub: {error}":["GitHub에서 받지 못했습니다: {error}","GitHub から取得できませんでした: {error}","无法从 GitHub 获取：{error}","No se pudo descargar de GitHub: {error}"],

"Installer files for {os}":["{os}용 설치 파일 준비","{os} 用のインストーラーファイル","{os} 安装程序文件","Archivos del instalador para {os}"],
"This server has no retail programs for {os}. Upload the files below, built on {os} or taken from a release, and from then on this server makes {os} installers.":["이 서버에는 {os}용 retail 프로그램이 없습니다. {os}에서 빌드했거나 배포판에서 받은 아래 파일을 올리면, 이후로는 이 서버가 {os}용 설치 파일을 만들어 줍니다.","このサーバーには {os} 用の retail プログラムがありません。{os} でビルドしたかリリースから入手した以下のファイルをアップロードすると、以後このサーバーが {os} 用インストーラーを作成します。","此服务器没有适用于 {os} 的 retail 程序。上传下列文件（在 {os} 上构建或从发布版获取）后，此服务器即可生成 {os} 安装程序。","Este servidor no tiene programas de retail para {os}. Sube los archivos de abajo, compilados en {os} o tomados de una versión publicada, y desde entonces este servidor creará instaladores para {os}."],
"All files are ready.":["모든 파일이 준비됐습니다.","すべてのファイルが揃いました。","所有文件均已就绪。","Todos los archivos están listos."],
"Uploading {name}…":["{name} 올리는 중…","{name} をアップロード中…","正在上传 {name}…","Subiendo {name}…"],
"Uploaded {name}":["{name}을(를) 올렸습니다","{name} をアップロードしました","已上传 {name}","{name} subido"],
};
const LANGS=["ko","ja","zh","es"];
const LANG=(navigator.languages||[navigator.language]).map(l=>String(l).slice(0,2).toLowerCase()).find(l=>l==="en"||LANGS.includes(l))||"en";
const COL=LANGS.indexOf(LANG);
// t("Seen {n} min ago",{n:5}): the text in the page's language, placeholders filled in
function t(en,vars){let s=(COL>=0&&TR[en]?.[COL])||en;for(const k in vars||{})s=s.split("{"+k+"}").join(vars[k]);return s}
document.documentElement.lang=LANG;
document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.textContent));
document.title=t("retail server");

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let view=null,invites=[],nodes=[];
function toast(m,ms=2400){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),ms)}
async function api(path,body){
  const r=await fetch(path,body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json","X-Retail-Web":"1"},body:JSON.stringify(body)});
  if(r.headers.get("content-type")?.includes("svg"))return r.text();
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||t("Error {status}",{status:r.status}));
  return j;
}
async function act(path,body,msg){closeMenus();try{const j=await api(path,body??{});if(msg)toast(msg);await load(true);return j}catch(e){toast(e.message)}}
function copy(text){navigator.clipboard?.writeText(text).then(()=>toast(t("Copied")),()=>prompt(t("Copy this"),text))}
function closeMenus(except){document.querySelectorAll("details.menu[open]").forEach(d=>{if(d!==except)d.open=false})}
document.addEventListener("click",e=>{if(!e.target.closest("details.menu"))closeMenus()});
document.addEventListener("toggle",e=>{if(e.target.matches?.("details.menu")&&e.target.open)closeMenus(e.target)},true);
const menu=(label,items,cls="")=>`<details class="menu"><summary class="btn ${cls}" aria-label="${label==="⋯"?esc(t("More")):esc(label)}">${esc(label)}</summary><div class="pop">${items}</div></details>`;
function expires(at){if(at>=9e18)return t("Never expires");const h=Math.round((at-Date.now()/1000)/3600);return h<=0?t("Expired"):h<48?t("Expires in {n} h",{n:h}):t("Expires in {n} d",{n:Math.round(h/24)})}
function ago(at){if(!at)return t("Never connected");const m=Math.floor((Date.now()/1000-at)/60);return m<1?t("Seen just now"):m<60?t("Seen {n} min ago",{n:m}):m<1440?t("Seen {n} h ago",{n:Math.floor(m/60)}):t("Seen {n} d ago",{n:Math.floor(m/1440)})}
function routerText(r){if(!r)return t("Automatic opening is off");return r.kind==="opened"?t("Opened with {method} (TCP {tcp}, UDP {udp})",r):t("Could not open automatically")}
function noticeText(n){if(!n)return"";if(n.kind==="cgnat")return t("The router's external address ({ip}) is private (CGNAT). Devices on other networks can't reach this server without a helper node; devices on the same network can still join.",{ip:n.router_ip});return t("The router did not open ports automatically. For devices on other networks to connect, forward TCP {tcp} and UDP {udp} to this computer on the router, or set a domain.",n)}
async function shareBlock(code){let svg="";try{svg=await api("/api/qr",{text:code})}catch{}return`<div class="qr">${svg}</div><div class="text"><div class="code">${esc(code)}</div><div><button onclick="copy(this.closest('.text').querySelector('.code').textContent)">${esc(t("Copy code"))}</button></div></div>`}
async function showShare(title,code){closeMenus();$("#shareTitle").textContent=title;$("#shareBody").innerHTML=await shareBlock(code);$("#shareDlg").showModal()}
// A translated string with one bolded label in it
const withButton=(en,label)=>esc(t(en,{button:"\u0000"})).replace("\u0000",`<b>${esc(t(label))}</b>`);

function render(){
  const s=view.server;
  $("#state").textContent=t(s.running?"Running":"Off");$("#state").className="pill"+(s.running?" on":"");
  if(!s.running){
    $("#server").innerHTML=`<div class="card pad"><p style="margin-top:0">${esc(t("The network server on this device is off. Turn it on to make this device the server and invite other devices."))}</p>${s.last_error?`<div class="notice">${esc(s.last_error)}</div>`:""}<button class="primary" onclick="act('/api/server/start',{},t('Server turned on'))">${esc(t("Turn on server"))}</button></div>`;
    $("#networked").hidden=true;return;
  }
  const rows=[[t("Address from outside"),s.public||t("Not reachable from other networks")],[t("This network"),(s.lan||[]).slice(0,3).join(", ")||"-"],[t("Router ports"),routerText(s.router)]];
  if(s.reality)rows.push(["REALITY",t("On · looks like {site}",{site:s.reality})]);
  if(s.helper)rows.push([t("Helper node"),`${s.helper} · ${t(s.helper_linked?"Connected":"Not connected")}`]);
  if((s.fronts||[]).length)rows.push(["CDN",s.fronts.join(", ")]);
  const notice=noticeText(s.notice);
  $("#server").innerHTML=`<div class="card pad"><dl class="rows">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>${notice?`<div class="notice">${esc(notice)}</div>`:""}<button class="danger" onclick="stopServer()">${esc(t("Turn off server"))}</button></div>`;
  $("#networked").hidden=false;

  // Named invites first, then single-use ones still open, newest first
  const now=Date.now()/1000;
  invites=(s.invites||[]).filter(i=>i.name||(i.expires_at>now&&(!i.used||i.reusable))).sort((a,b)=>(!!b.name)-(!!a.name)||b.id-a.id);
  const clients=view.clients||[];
  $("#invites").innerHTML=invites.length?invites.map((i,k)=>{
    if(!i.name){
      const kind=t(i.reusable?"Reusable invite":"One-time invite");
      return`<div class="item"><div class="main"><div class="name">${esc(kind)} <span class="pill">#${i.id}</span></div><div class="meta">${esc(i.reusable?t("{n} joined",{n:i.uses}):t("Not used yet"))} · ${esc(expires(i.expires_at))} · ${esc(t("the code was shown only when created"))}</div></div>
      <div class="side">${menu("⋯",`<button class="danger" onclick="revoke(${k})">${esc(t("Expire"))}</button>`,"icon")}</div></div>`;
    }
    const dl=clients.map(c=>!c.missing.length?`<a href="/download/${i.id}/${encodeURIComponent(c.id)}" onclick="closeMenus();toast(t('Preparing the installer…'))">${esc(t("For {os}",{os:c.label}))}</a>`
      :c.fetchable?`<button onclick="getClient(${i.id},'${esc(c.id)}')">${esc(t("For {os}",{os:c.label}))}</button>`
      :`<button class="sub" onclick="openUpload('${esc(c.id)}')">${esc(t("{os}: upload files…",{os:c.label}))}</button>`).join("");
    return`<div class="item"><div class="main"><div class="name">${esc(i.name)}</div><div class="meta">${esc(t("Multi-device"))} · ${esc(t("{n} joined",{n:i.uses}))} · ${esc(expires(i.expires_at))}</div></div>
    <div class="side">${menu(t("Download ▾"),dl)}${menu("⋯",`<button onclick="codeOf(${k},'qr')">${esc(t("Show code and QR"))}</button><button onclick="codeOf(${k},'copy')">${esc(t("Copy code"))}</button><button onclick="regen(${k})">${esc(t("New code"))}</button><button class="danger" onclick="revoke(${k})">${esc(t("Expire"))}</button>`,"icon")}</div></div>`}).join(""):`<div class="empty">${withButton("No invites yet. Start with {button}.","Create invite")}</div>`;

  nodes=(s.nodes||[]).slice().sort((a,b)=>(view.own_ip===b.ip)-(view.own_ip===a.ip)||b.online-a.online||a.hostname.localeCompare(b.hostname));
  const online=nodes.filter(n=>n.online).length;
  $("#count").textContent=nodes.length?t("{online} of {total} connected",{online,total:nodes.length}):"";
  $("#nodes").innerHTML=nodes.length?nodes.map((n,k)=>{const self=view.own_ip===n.ip;const allowed=view.admins.includes(n.id);
    return`<div class="item"><div class="main"><div class="name"><span class="dot${n.online?" on":""}"></span>${esc(n.hostname)}${self?`<span class="pill">${esc(t("This device"))}</span>`:""}${n.exit_node?'<span class="pill">Exit node</span>':""}${allowed&&!self?`<span class="pill on">${esc(t("Can manage"))}</span>`:""}</div>
    <div class="meta">${esc(n.ip)} · ${esc(n.os)} · ${esc(n.online?t("Connected"):ago(n.last_seen))}</div></div>
    ${self?"":`<div class="side">${menu("⋯",`<button onclick="setAdmin(${k},${!allowed})">${esc(t(allowed?"Stop allowing management":"Allow managing from this device"))}</button><button class="danger" onclick="removeNode(${k})">${esc(t("Remove device"))}</button>`,"icon")}</div>`}</div>`}).join(""):`<div class="empty">${esc(t("No devices have joined yet."))}</div>`;
  $("#meshNote").textContent=view.mesh_url?t("Devices allowed to manage can open this page at {url} while connected to retail.",{url:view.mesh_url}):"";
}
async function load(force){if(!force&&(document.querySelector("details.menu[open]")||document.querySelector("dialog[open]")))return;
  try{view=await api("/api/status");render()}catch(e){$("#server").innerHTML=`<div class="card pad"><div class="notice">${esc(e.message)}</div></div>`}}

function stopServer(){if(confirm(t("Turning the server off disconnects every device. Their registrations stay, so they reconnect when it is back on.")))act("/api/server/stop",{},t("Server turned off"))}
async function codeOf(k,how){closeMenus();const i=invites[k];try{const j=await api(`/api/invites/${i.id}/code`,{});how==="qr"?showShare(t("Invite '{name}'",{name:i.name}),j.code):copy(j.code)}catch(e){toast(e.message)}}
function regen(k){const i=invites[k];if(confirm(t("Make a new code for '{name}'? The old code and installers that contain it stop working; devices that already joined stay.",{name:i.name})))act("/api/invites",{name:i.name},t("New code made"))}
function revoke(k){const i=invites[k];if(confirm(i.name?t("Expire the invite '{name}'? Devices that already joined stay.",{name:i.name}):t("Expire this invite? Devices that already joined stay.")))act(`/api/invites/${i.id}/revoke`,{},t("Invite expired"))}
function setAdmin(k,allowed){const n=nodes[k];act(`/api/nodes/${n.id}/admin`,{allowed},allowed?t("{host} can open this page now",{host:n.hostname}):t("Management turned off"))}
function removeNode(k){const n=nodes[k];if(confirm(t("Remove {host} from the network? It will need an invite to come back.",{host:n.hostname})))act(`/api/nodes/${n.id}/delete`,{},t("Device removed"))}

// Creating an invite: one dialog for both kinds
let draft={kind:"multi",ttl:null};
function openCreate(){draft={kind:"multi",ttl:null};drawCreate();$("#createDlg").showModal();setTimeout(()=>$("#cName")?.focus(),50)}
function drawCreate(){
  const multi=draft.kind==="multi";
  const ttls=[[null,"No expiry"],[168,"7 days"],[720,"30 days"]];
  $("#createBody").innerHTML=`<h3>${esc(t("Create invite"))}</h3><p class="muted small" style="margin:0 0 14px">${esc(t(multi?"Named and shared by many devices. You can download installers or make a new code later.":"One device can join once within 24 hours."))}</p>
  <div class="seg"><button class="${multi?"on":""}" onclick="draft.kind='multi';drawCreate()">${esc(t("Multi-device"))}</button><button class="${multi?"":"on"}" onclick="draft.kind='once';drawCreate()">${esc(t("One-time"))}</button></div>
  ${multi?`<div class="field"><label for="cName">${esc(t("Name"))}</label><input id="cName" maxlength="40" placeholder="${esc(t("e.g. Family"))}" value="${esc(draft.name||"")}" oninput="draft.name=this.value" onkeydown="if(event.key==='Enter')create()"></div>
  <div class="field"><label>${esc(t("Expires"))}</label><div class="seg">${ttls.map(([v,l])=>`<button class="${draft.ttl===v?"on":""}" onclick="draft.ttl=${v};drawCreate()">${esc(t(l))}</button>`).join("")}</div></div>`:""}
  <div class="actions"><button onclick="$('#createDlg').close()">${esc(t("Cancel"))}</button><button class="primary" onclick="create()">${esc(t("Create"))}</button></div>`;
}
async function create(){
  const multi=draft.kind==="multi";const name=(draft.name||"").trim();
  if(multi&&!name)return toast(t("Enter a name"));
  if(multi&&(view.server.invites||[]).some(i=>i.name===name)&&!confirm(t("An invite named '{name}' already exists. A new code makes the old one unusable.",{name})))return;
  try{
    const j=await api("/api/invites",multi?{name,ttl_hours:draft.ttl}:{reusable:false});
    await load(true);
    const lead=multi?withButton("Installers are under {button} in the list.","Download ▾"):esc(t("This code is shown only now."));
    $("#createBody").innerHTML=`<h3>${esc(multi?t("Invite '{name}' created",{name}):t("One-time invite created"))}</h3><p class="muted small" style="margin:0 0 14px">${lead} ${esc(t("Scan it with a phone or copy the code to share it."))}</p><div class="share">${await shareBlock(j.code)}</div><div class="actions"><button class="primary" onclick="$('#createDlg').close()">${esc(t("Done"))}</button></div>`;
  }catch(e){toast(e.message)}
}

// A client this server has no programs for: fetched from the official
// release, or uploaded by hand if that fails
async function getClient(invite,id){
  closeMenus();toast(t("Fetching the official client from GitHub. Only the first time takes a while…"),120000);
  try{await api(`/api/clients/${encodeURIComponent(id)}/fetch`,{});toast(t("Preparing the installer…"));location.href=`/download/${invite}/${encodeURIComponent(id)}`;load(true)}
  catch(e){toast(t("Couldn't fetch from GitHub: {error}",{error:e.message}),6000);openUpload(id)}
}

// Program files for a client this server lacks (a macOS build, say)
let target=null;
function openUpload(id){closeMenus();target=(view.clients||[]).find(c=>c.id===id);drawUpload();$("#uploadDlg").showModal()}
function drawUpload(){
  const c=target;if(!c)return;
  const files=c.missing.map(f=>`<div class="file"><span>${esc(f)}</span><button onclick="pick('${esc(f)}')">${esc(t("Choose file"))}</button></div>`).join("");
  $("#uploadBody").innerHTML=`<h3>${esc(t("Installer files for {os}",{os:c.label}))}</h3><p class="muted small" style="margin:0">${esc(t("This server has no retail programs for {os}. Upload the files below, built on {os} or taken from a release, and from then on this server makes {os} installers.",{os:c.label}))}</p>
  ${c.missing.length?`<div class="files">${files}</div>`:`<p>${esc(t("All files are ready."))}</p>`}<div class="actions"><button onclick="$('#uploadDlg').close()">${esc(t(c.missing.length?"Close":"Done"))}</button></div>`;
}
function pick(name){const inp=document.createElement("input");inp.type="file";inp.onchange=()=>inp.files[0]&&send(name,inp.files[0]);inp.click()}
async function send(name,file){
  toast(t("Uploading {name}…",{name}));
  try{const r=await fetch(`/api/clients/${encodeURIComponent(target.id)}/${encodeURIComponent(name)}`,{method:"POST",headers:{"X-Retail-Web":"1","Content-Type":"application/octet-stream"},body:file});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||t("Error {status}",{status:r.status}));
    toast(t("Uploaded {name}",{name}));await load(true);target=(view.clients||[]).find(c=>c.id===target.id);drawUpload();
  }catch(e){toast(e.message)}
}
load(true);setInterval(load,5000);
</script>
</body>
