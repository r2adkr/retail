# Build, lint and unit-test on the three systems the client ships for
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macOS on Intel: Apple silicon runners are often too busy to take
        # the job at all; the code is the same for both
        os: [ubuntu-22.04, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the compiler; this installs it
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The small-machine builds the release ships: 64-bit ARM natively, 32-bit ARM cross-compiled
  arm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04-arm
          - os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Cross toolchain
        if: matrix.target
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf
          rustup target add ${{ matrix.target }}
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
          echo "CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
      # One cache per runner and target: the native and cross builds share the
      # job name, and a restored cache missing a crate (ksni) broke the native one
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target || 'native' }}
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --locked -p retail-daemon -p retail-cli --target ${{ matrix.target }}
          else
            cargo test --workspace --locked
          fi
