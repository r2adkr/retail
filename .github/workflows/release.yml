# Official clients, built when a version tag (v0.1.0, ...) is pushed. Servers
# fetch these by name to make one-click client packages, so asset names are
# `<program>-<os>-<arch>[.exe]`, plus `wintun-windows-x86_64.dll`,
# `VERSION` and `SHA256SUMS`. Daemons update themselves from the same files.
name: release

on:
  push:
    tags: ['v*']
    branches: [release-rehearsal]
  # A rehearsal (a push to the release-rehearsal branch, or run by hand):
  # builds everything and the image, publishes nothing
  workflow_dispatch:

# Read-only by default; only the publishing job can write releases. Actions are
# pinned by commit, since daemons install what the release contains.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            variant: linux-x86_64
            ext: ""
          # Raspberry Pi 3/4/5 and other 64-bit ARM boards, built natively.
          # On 22.04 so the programs need no newer glibc than Debian 12 has
          - os: ubuntu-22.04-arm
            variant: linux-aarch64
            ext: ""
          # 32-bit ARM (Raspberry Pi Zero 2 / 2 / 3 on a 32-bit OS, routers):
          # daemon and CLI only, cross-compiled
          - os: ubuntu-22.04
            variant: linux-arm
            target: armv7-unknown-linux-gnueabihf
            programs: retaild retail
            ext: ""
          - os: windows-latest
            variant: windows-x86_64
            ext: ".exe"
          - os: macos-15
            variant: macos-aarch64
            ext: ""
          - os: macos-15-intel
            variant: macos-x86_64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Tag matches the crate version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Cross toolchain
        if: matrix.target
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf
          rustup target add ${{ matrix.target }}
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
          echo "CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        shell: bash
        run: |
          programs="${{ matrix.programs || 'retail-tray retaild retail' }}"
          # No `case` inside $(...): macOS's bash 3.2 cannot parse it
          packages=""
          for b in $programs; do
            case $b in
              retaild) packages="$packages -p retail-daemon" ;;
              retail) packages="$packages -p retail-cli" ;;
              retail-tray) packages="$packages -p retail-tray" ;;
            esac
          done
          target="${{ matrix.target }}"
          cargo build --release --locked $packages ${target:+--target $target}
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          out=target/${{ matrix.target || '' }}/release
          for b in ${{ matrix.programs || 'retail-tray retaild retail' }}; do
            cp "$out/$b${{ matrix.ext }}" "dist/$b-${{ matrix.variant }}${{ matrix.ext }}"
          done
      - name: wintun.dll
        if: matrix.variant == 'windows-x86_64'
        shell: bash
        run: |
          curl -fsSL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          # The hash wintun.net publishes for 0.14.1: a changed download fails the release
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          cp wintun/bin/amd64/wintun.dll dist/wintun-windows-x86_64.dll
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.variant }}
          path: dist/*

  # The server image (retaild and retail, no tunnel of its own) for
  # 64-bit Intel and ARM, from the same programs as the release
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Programs by Docker platform
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            platform=${pair%%:*}; arch=${pair##*:}
            mkdir -p "image/$platform"
            for b in retaild retail; do cp "dist/$b-linux-$arch" "image/$platform/$b"; done
          done
          chmod 755 image/*/*
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packaging/docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

  publish:
    needs: [build, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      # VERSION lets daemons find the newest release through releases/latest/download/VERSION
      - run: cd dist && echo "${GITHUB_REF_NAME#v}" > VERSION && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
