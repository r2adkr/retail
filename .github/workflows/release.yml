# Official releases, built when a version tag (v0.1.0, ...) is pushed. A
# release holds one installer per system, with every program inside:
#   retail-windows-x86_64.exe, retail-macos.dmg (Apple silicon and Intel),
#   retail-linux-x86_64.deb, retail-linux-aarch64.deb, retail-linux-arm.deb
# plus `VERSION` and `SHA256SUMS`. Daemons update themselves from these, and
# servers take other systems' programs out of them for their client packages.
name: release

on:
  push:
    tags: ['v*']
    branches: [release-rehearsal]
  # A rehearsal (a push to the release-rehearsal branch, or run by hand):
  # builds the installers and the image and tries them, publishes nothing
  workflow_dispatch:

# Read-only by default; only the publishing job can write releases. Actions are
# pinned by commit, since daemons install what the release contains.
permissions:
  contents: read

jobs:
  # The programs of each system, kept as artifacts of this run only
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            variant: linux-x86_64
            ext: ""
          # Raspberry Pi 3/4/5 and other 64-bit ARM boards, built natively.
          # On 22.04 so the programs need no newer glibc than Debian 12 has
          - os: ubuntu-22.04-arm
            variant: linux-aarch64
            ext: ""
          # 32-bit ARM (Raspberry Pi Zero 2 / 2 / 3 on a 32-bit OS, routers), cross-compiled
          - os: ubuntu-22.04
            variant: linux-arm
            target: armv7-unknown-linux-gnueabihf
            ext: ""
          - os: windows-latest
            variant: windows-x86_64
            ext: ".exe"
          - os: macos-15
            variant: macos-aarch64
            ext: ""
          - os: macos-15-intel
            variant: macos-x86_64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Tag matches the crate version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Cross toolchain
        if: matrix.target
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf
          rustup target add ${{ matrix.target }}
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
          echo "CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
      # No build cache: releases are built from scratch, so nothing restored
      # from an earlier run (a cache missing a crate, as ksni once was on
      # ARM, or one written by another workflow) ends up in what ships
      - name: Build
        shell: bash
        run: |
          target="${{ matrix.target }}"
          cargo build --release --locked -p retail-tray -p retail-daemon -p retail-cli ${target:+--target $target}
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          out=target/${{ matrix.target || '' }}/release
          for b in retail-tray retaild retail; do
            cp "$out/$b${{ matrix.ext }}" "dist/$b-${{ matrix.variant }}${{ matrix.ext }}"
          done
      - name: wintun.dll
        if: matrix.variant == 'windows-x86_64'
        shell: bash
        run: |
          curl -fsSL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          # The hash wintun.net publishes for 0.14.1: a changed download fails the release
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          cp wintun/bin/amd64/wintun.dll dist/wintun-windows-x86_64.dll
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: programs-${{ matrix.variant }}
          path: dist/*

  # Windows and Linux installers: the programs put together (scripts/bundle.py)
  installers:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          pattern: programs-*
          merge-multiple: true
      # Windows: the installer itself. Linux: a .deb per processor that runs
      # it (data uncompressed, so daemons and servers read the installer in place)
      - name: Bundle
        run: |
          mkdir out inst
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          for pair in linux-x86_64:amd64 linux-aarch64:arm64 linux-arm:armhf; do
            v=${pair%%:*}; arch=${pair##*:}
            python3 scripts/bundle.py "inst/retail-$v" "dist/retail-tray-$v" "retaild=dist/retaild-$v" "retail=dist/retail-$v"
            python3 scripts/bundle.py --deb "out/retail-$v.deb" "inst/retail-$v" "$arch" "$version"
            dpkg-deb --info "out/retail-$v.deb" | sed -n '1,12p'
          done
          v=windows-x86_64
          python3 scripts/bundle.py "out/retail-$v.exe" "dist/retail-tray-$v.exe" \
            "retaild.exe=dist/retaild-$v.exe" "retail.exe=dist/retail-$v.exe" "wintun.dll=dist/wintun-$v.dll"
          ls -l out
      - name: The daemon's reader finds the installer in the .deb
        run: |
          rustup show active-toolchain || rustup toolchain install
          RETAIL_BUNDLE_DEB="$PWD/out/retail-linux-x86_64.deb" cargo test --locked -p retail-proto bundle_py_deb -- --nocapture
      # As a user would: the package through apt (the daemon then runs from
      # systemd), and after removing it, the one-line script without apt
      - name: Try the Linux package and the install script
        run: |
          id
          sudo apt-get install -y ./out/retail-linux-x86_64.deb
          systemctl is-active retaild
          # In the app menu, with its icon
          test -f /usr/share/applications/retail.desktop
          test -f /usr/local/share/icons/hicolor/256x256/apps/retail.png
          file /usr/local/share/icons/hicolor/256x256/apps/retail.png | grep -q PNG
          getent group retail
          retail status
          # Root may change settings, and members of the retail group without
          # the token (the installer adds the user who ran sudo; the daemon
          # reads /etc/group, which this shell's own groups do not show yet);
          # anyone else is refused
          sudo retail set --auto-update false
          getent group retail | grep -qw "$(id -un)"
          retail set --auto-update false
          out=$(sudo -u nobody retail set --auto-update false 2>&1) && { echo "a non-member changed settings: $out"; exit 1; }
          echo "$out" | grep -q "not allowed"
          sudo apt-get remove -y retail
          if systemctl is-active --quiet retaild; then echo "still running after removal"; exit 1; fi
          test ! -e /usr/local/bin/retaild
          mkdir rel && cp out/retail-linux-x86_64.deb rel/ && (cd rel && sha256sum * > SHA256SUMS)
          RETAIL_RELEASES="file://$PWD/rel" RETAIL_NO_APT=1 sh scripts/install.sh
          systemctl is-active retaild
          retail status
          # Without the package the installer makes the app menu entry
          grep -q 'Exec=/usr/local/bin/retail-tray --show' /usr/local/share/applications/retail.desktop
          sudo /usr/local/bin/retail-tray --uninstall --yes
          test ! -e /usr/local/share/applications/retail.desktop
          test ! -e /usr/local/share/icons/hicolor/256x256/apps/retail.png
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installers-other
          path: out/*

  # One macOS installer for both processors (universal programs): a disk
  # image holding retail.app, with the installer also in front of the image's
  # data for daemons and servers to read (scripts/bundle.py --dmg)
  macos:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          pattern: programs-macos-*
          merge-multiple: true
      # retail.app runs the plain tray app, which finds the installer among
      # its resources; signed ad hoc as a whole (no Developer ID yet)
      - name: Universal programs, the app and the disk image
        run: |
          mkdir uni out image
          for b in retail-tray retaild retail; do
            lipo -create "dist/$b-macos-aarch64" "dist/$b-macos-x86_64" -output "uni/$b"
            lipo -info "uni/$b"
          done
          python3 scripts/bundle.py uni/installer uni/retail-tray retaild=uni/retaild retail=uni/retail
          python3 scripts/bundle.py --app image/retail.app uni/installer uni/retail-tray
          codesign --force --deep --sign - image/retail.app
          codesign --verify --deep --strict --verbose=2 image/retail.app
          hdiutil create -volname retail -srcfolder image -format UDZO -ov plain.dmg
          python3 scripts/bundle.py --dmg out/retail-macos.dmg uni/installer plain.dmg
          ls -l out
      # macOS still opens the image with the installer in front, and the
      # daemon's reader finds it there
      - name: Check the disk image
        run: |
          hdiutil verify out/retail-macos.dmg
          rustup show active-toolchain || rustup toolchain install
          RETAIL_BUNDLE_DMG="$PWD/out/retail-macos.dmg" cargo test --locked -p retail-proto bundle_py_dmg -- --nocapture
      - name: Try the macOS installer
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/vol" out/retail-macos.dmg
          mkdir try && ditto "$RUNNER_TEMP/vol/retail.app" try/retail.app
          hdiutil detach "$RUNNER_TEMP/vol"
          cd try
          # As a browser download arrives: what Gatekeeper makes of it (an
          # unsigned app is expected to be refused here; the point is "refused", not "damaged")
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" retail.app
          spctl --assess --type execute --verbose=4 retail.app || true
          codesign --verify --deep --strict --verbose=2 retail.app
          xattr -d com.apple.quarantine retail.app
          ./retail.app/Contents/MacOS/retail --package-info
          sudo ./retail.app/Contents/MacOS/retail --yes --prefix "$RUNNER_TEMP/r" --no-service --no-autostart
          ls -l "$RUNNER_TEMP/r/bin"
          "$RUNNER_TEMP/r/bin/retail" status
          # A change from a user other than the daemon's (root): the listener
          # check must find root's socket, and the admin group may control retail
          "$RUNNER_TEMP/r/bin/retail" set --auto-update false
          sudo pkill -f "$RUNNER_TEMP/r/bin/retaild"
      # The one-line script as a Mac user would run it: the disk image,
      # checked, mounted, installed with launchd
      - name: Try the install script
        run: |
          mkdir rel && cp out/retail-macos.dmg rel/ && (cd rel && shasum -a 256 * > SHA256SUMS)
          RETAIL_RELEASES="file://$PWD/rel" sh scripts/install.sh
          sleep 2
          /usr/local/bin/retail status
          # retail.app in Applications, which opens the menu bar app's popup
          plutil -lint /Applications/retail.app/Contents/Info.plist
          test -x /Applications/retail.app/Contents/MacOS/retail
          grep -q 'retail-tray.*--show' /Applications/retail.app/Contents/MacOS/retail
          test -s /Applications/retail.app/Contents/Resources/retail.icns
          sudo /usr/local/bin/retail-tray --uninstall --yes
          test ! -e /Applications/retail.app
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installers-macos
          path: out/*

  # The Windows installer on a Windows machine
  windows:
    needs: installers
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: installers-other
          path: out
      - name: Try the Windows installer
        shell: pwsh
        run: |
          $inst = "out\retail-windows-x86_64.exe"
          # A windowed program: run it, take its output from a file. Only the
          # installer is waited for (Start-Process -Wait would also wait for
          # the daemon it leaves running), for at most two minutes.
          function Run-Installer($out, [string[]]$params) {
            $p = Start-Process $inst -ArgumentList $params -PassThru -RedirectStandardOutput $out
            if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "installer $params did not finish" }
            Get-Content $out | Write-Host
            return $p.ExitCode
          }
          $null = Run-Installer info.txt @('--package-info')
          $dir = "$env:RUNNER_TEMP\r"
          $code = Run-Installer install.txt @('--yes','--prefix',$dir,'--no-service','--no-autostart')
          if ($code -ne 0) { throw "installer exit $code" }
          Get-ChildItem "$dir\bin"
          & "$dir\bin\retail.exe" status
          if ($LASTEXITCODE -ne 0) { throw "retail status failed" }
          # A change: the listener check must pass (the daemon is this
          # session's). The daemon then takes it if this shell may read its
          # token: elevated, or signed in at the computer (INTERACTIVE); a
          # runner's service logon unelevated may not, and is refused by the daemon
          whoami /groups | Select-String 'Mandatory Label|INTERACTIVE|SERVICE '
          $out = & "$dir\bin\retail.exe" set --auto-update false 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0 -and $out -notmatch 'not allowed') { throw "retail set failed before reaching the daemon" }
          # Again over the running programs, as an update by hand does
          $code = Run-Installer again.txt @('--yes','--prefix',$dir,'--no-service','--no-autostart')
          if ($code -ne 0) { throw "installing over the running programs: exit $code" }
          Get-ChildItem "$dir\bin"
          Stop-Process -Name retaild -Force
          # A refused change above left its exit code, which the step would report
          exit 0
      # As a user installs: Task Scheduler, Program Files, ProgramData. Then
      # an update over a device that hosts a network, which must come back
      # with the server and its files, and in time for the installer
      - name: Install for real, host a network, update over it
        shell: pwsh
        run: |
          $inst = "out\retail-windows-x86_64.exe"
          function Run-Installer($out, [string[]]$params) {
            $p = Start-Process $inst -ArgumentList $params -PassThru -RedirectStandardOutput $out
            if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw "installer $params did not finish" }
            Get-Content $out | Write-Host
            return $p.ExitCode
          }
          $retail = "C:\Program Files\retail\retail.exe"
          $code = Run-Installer first.txt @('--yes','--no-autostart')
          if ($code -ne 0) { throw "installer exit $code" }
          & $retail status
          if ($LASTEXITCODE -ne 0) { throw "retail status failed" }
          # Signed-in users read the token through the folder's entries; a
          # file without them is readable by no one
          $acl = icacls C:\ProgramData\retail-api\token | Out-String
          $acl
          if ($acl -notmatch 'INTERACTIVE') { throw "the token file does not let signed-in users read it" }
          & $retail set --auto-update false
          if ($LASTEXITCODE -ne 0) { throw "retail set was refused" }
          # In the Start menu and in Settings → Installed apps
          $lnk = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\retail.lnk"
          if (-not (Test-Path $lnk)) { throw "no Start menu entry" }
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          "$($s.TargetPath) $($s.Arguments) $($s.IconLocation)"
          if ($s.Arguments -ne '--show') { throw "the Start menu entry does not open the popup" }
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\retail'
          Get-ItemProperty $key | Format-List DisplayName,DisplayVersion,UninstallString,DisplayIcon,EstimatedSize
          if ((Get-ItemProperty $key).DisplayName -ne 'retail') { throw "not in Installed apps" }
          & $retail server start --no-join
          if ($LASTEXITCODE -ne 0) { throw "retail server start failed" }
          & $retail server status
          # The update: the installer stops the daemon, replaces the programs
          # and waits for the new daemon
          $t = [Diagnostics.Stopwatch]::StartNew()
          $code = Run-Installer update.txt @('--yes','--no-autostart')
          "update took $($t.Elapsed.TotalSeconds) s"
          if ($code -ne 0) { throw "updating: exit $code" }
          $server = & $retail server status | Out-String
          $server
          if ($server -match 'not running') { throw "the server did not come back after the update" }
          & $retail set --auto-update false
          if ($LASTEXITCODE -ne 0) { throw "retail set was refused after the update" }
          # Every file the daemon keeps is still readable to it
          Get-ChildItem C:\ProgramData\retail -Recurse -File | ForEach-Object {
            try { $null = [IO.File]::ReadAllBytes($_.FullName) } catch { throw "unreadable after the update: $($_.FullName)" }
          }
          # As Settings → Installed apps does, from the installed program
          Start-Process "C:\Program Files\retail\retail-tray.exe" -ArgumentList '--uninstall','--yes' -Wait
          Start-Sleep 5
          if (Test-Path $lnk) { throw "the Start menu entry stayed" }
          if (Test-Path $key) { throw "the Installed apps entry stayed" }
          if (Test-Path "C:\Program Files\retail") { Get-ChildItem "C:\Program Files\retail"; throw "the program folder stayed" }
          exit 0

  # The server image (retaild and retail, no tunnel of its own) for
  # 64-bit Intel and ARM, from the same programs as the release
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          pattern: programs-linux-*
          merge-multiple: true
      - name: Programs by Docker platform
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            platform=${pair%%:*}; arch=${pair##*:}
            mkdir -p "image/$platform"
            for b in retaild retail; do cp "dist/$b-linux-$arch" "image/$platform/$b"; done
          done
          chmod 755 image/*/*
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          # No build-record artifact: it is not a release file
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

  # Everything the release holds, checked; created only for a tag
  publish:
    needs: [installers, macos, windows, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the installers (named after their system)
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          pattern: installers-*
          merge-multiple: true
      # VERSION lets daemons find the newest release through releases/latest/download/VERSION
      - run: |
          cd dist
          echo "${GITHUB_REF_NAME#v}" > VERSION
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          [ "$(ls | wc -l)" = 7 ] || { echo "expected 5 installers, VERSION and SHA256SUMS"; ls; exit 1; }
      # The notes: docs/releases/<tag>.md where there is one (otherwise
      # GitHub's list of changes), and the checksums at the end
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: src
          sparse-checkout: docs/releases
      - run: |
          notes="src/docs/releases/${GITHUB_REF_NAME}.md"
          generate=--generate-notes
          if [ -f "$notes" ]; then cp "$notes" notes.md; generate=; else : > notes.md; fi
          { echo; echo "## SHA-256 checksums"; echo; echo '```'; grep -v ' VERSION$' dist/SHA256SUMS; echo '```'; } >> notes.md
          echo "GENERATE=$generate" >> "$GITHUB_ENV"
          cat notes.md
      - if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "retail ${GITHUB_REF_NAME#v}" --notes-file notes.md $GENERATE
