# Official releases, built when a version tag (v0.1.0, ...) is pushed. A
# release holds one installer per system, with every program inside:
#   retail-windows-x86_64.exe, retail-macos.zip (Apple silicon and Intel),
#   retail-linux-x86_64, retail-linux-aarch64, retail-linux-arm
# plus `VERSION` and `SHA256SUMS`. Daemons update themselves from these, and
# servers take other systems' programs out of them for their client packages.
name: release

on:
  push:
    tags: ['v*']
    branches: [release-rehearsal]
  # A rehearsal (a push to the release-rehearsal branch, or run by hand):
  # builds the installers and the image and tries them, publishes nothing
  workflow_dispatch:

# Read-only by default; only the publishing job can write releases. Actions are
# pinned by commit, since daemons install what the release contains.
permissions:
  contents: read

jobs:
  # The programs of each system, kept as artifacts of this run only
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            variant: linux-x86_64
            ext: ""
          # Raspberry Pi 3/4/5 and other 64-bit ARM boards, built natively.
          # On 22.04 so the programs need no newer glibc than Debian 12 has
          - os: ubuntu-22.04-arm
            variant: linux-aarch64
            ext: ""
          # 32-bit ARM (Raspberry Pi Zero 2 / 2 / 3 on a 32-bit OS, routers), cross-compiled
          - os: ubuntu-22.04
            variant: linux-arm
            target: armv7-unknown-linux-gnueabihf
            ext: ""
          - os: windows-latest
            variant: windows-x86_64
            ext: ".exe"
          - os: macos-15
            variant: macos-aarch64
            ext: ""
          - os: macos-15-intel
            variant: macos-x86_64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Tag matches the crate version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Cross toolchain
        if: matrix.target
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf
          rustup target add ${{ matrix.target }}
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
          echo "CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
      # No build cache: releases are built from scratch, so nothing restored
      # from an earlier run (a cache missing a crate, as ksni once was on
      # ARM, or one written by another workflow) ends up in what ships
      - name: Build
        shell: bash
        run: |
          target="${{ matrix.target }}"
          cargo build --release --locked -p retail-tray -p retail-daemon -p retail-cli ${target:+--target $target}
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          out=target/${{ matrix.target || '' }}/release
          for b in retail-tray retaild retail; do
            cp "$out/$b${{ matrix.ext }}" "dist/$b-${{ matrix.variant }}${{ matrix.ext }}"
          done
      - name: wintun.dll
        if: matrix.variant == 'windows-x86_64'
        shell: bash
        run: |
          curl -fsSL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          # The hash wintun.net publishes for 0.14.1: a changed download fails the release
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          cp wintun/bin/amd64/wintun.dll dist/wintun-windows-x86_64.dll
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: programs-${{ matrix.variant }}
          path: dist/*

  # Windows and Linux installers: the programs put together (scripts/bundle.py)
  installers:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          pattern: programs-*
          merge-multiple: true
      - name: Bundle
        run: |
          mkdir out
          for v in linux-x86_64 linux-aarch64 linux-arm; do
            python3 scripts/bundle.py "out/retail-$v" "dist/retail-tray-$v" "retaild=dist/retaild-$v" "retail=dist/retail-$v"
          done
          v=windows-x86_64
          python3 scripts/bundle.py "out/retail-$v.exe" "dist/retail-tray-$v.exe" \
            "retaild.exe=dist/retaild-$v.exe" "retail.exe=dist/retail-$v.exe" "wintun.dll=dist/wintun-$v.dll"
          ls -l out
      # The installer on this machine: it unpacks, starts the daemon, and the CLI it installed answers
      - name: Try the Linux installer
        run: |
          ./out/retail-linux-x86_64 --package-info
          sudo ./out/retail-linux-x86_64 --yes --prefix "$RUNNER_TEMP/r" --no-service --no-autostart
          ls -l "$RUNNER_TEMP/r/bin"
          "$RUNNER_TEMP/r/bin/retail" status
          # A change from another user than the daemon's (root), not in the
          # retail group: the listener check passes (root's socket) and the
          # daemon then refuses for want of its token
          out=$("$RUNNER_TEMP/r/bin/retail" set --auto-update false 2>&1) && { echo "a non-member changed settings: $out"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "not allowed" || { echo "expected the daemon's refusal"; exit 1; }
          sudo "$RUNNER_TEMP/r/bin/retail" set --auto-update false
          sudo pkill -f "$RUNNER_TEMP/r/bin/retaild"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installers-other
          path: out/*

  # One macOS installer for both processors (universal programs), as
  # retail.app in a zip so it stays runnable after a download
  macos:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          pattern: programs-macos-*
          merge-multiple: true
      # retail.app runs the plain tray app, which finds the installer among
      # its resources; signed ad hoc as a whole (no Developer ID yet)
      - name: Universal programs and the app
        run: |
          mkdir uni out
          for b in retail-tray retaild retail; do
            lipo -create "dist/$b-macos-aarch64" "dist/$b-macos-x86_64" -output "uni/$b"
            lipo -info "uni/$b"
          done
          python3 scripts/bundle.py uni/installer uni/retail-tray retaild=uni/retaild retail=uni/retail
          python3 scripts/bundle.py --app retail.app uni/installer uni/retail-tray
          codesign --force --deep --sign - retail.app
          codesign --verify --deep --strict --verbose=2 retail.app
          python3 scripts/bundle.py --zip out/retail-macos.zip retail.app
          ls -l out
      - name: Try the macOS installer
        run: |
          mkdir try && cd try && ditto -x -k ../out/retail-macos.zip .
          # As a browser download arrives: what Gatekeeper makes of it (an
          # unsigned app is expected to be refused here; the point is "refused", not "damaged")
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" retail.app
          spctl --assess --type execute --verbose=4 retail.app || true
          codesign --verify --deep --strict --verbose=2 retail.app
          xattr -d com.apple.quarantine retail.app
          ./retail.app/Contents/MacOS/retail --package-info
          sudo ./retail.app/Contents/MacOS/retail --yes --prefix "$RUNNER_TEMP/r" --no-service --no-autostart
          ls -l "$RUNNER_TEMP/r/bin"
          "$RUNNER_TEMP/r/bin/retail" status
          # A change from a user other than the daemon's (root): the listener
          # check must find root's socket, and the admin group may control retail
          "$RUNNER_TEMP/r/bin/retail" set --auto-update false
          sudo pkill -f "$RUNNER_TEMP/r/bin/retaild"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installers-macos
          path: out/*

  # The Windows installer on a Windows machine
  windows:
    needs: installers
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: installers-other
          path: out
      - name: Try the Windows installer
        shell: pwsh
        run: |
          $inst = "out\retail-windows-x86_64.exe"
          # A windowed program: wait for it and take its output from files
          $p = Start-Process $inst -ArgumentList '--package-info' -Wait -PassThru -RedirectStandardOutput info.txt
          Get-Content info.txt
          $dir = "$env:RUNNER_TEMP\r"
          $p = Start-Process $inst -ArgumentList '--yes','--prefix',$dir,'--no-service','--no-autostart' -Wait -PassThru -RedirectStandardOutput install.txt
          Get-Content install.txt
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          Get-ChildItem "$dir\bin"
          & "$dir\bin\retail.exe" status
          if ($LASTEXITCODE -ne 0) { throw "retail status failed" }
          & "$dir\bin\retail.exe" set --auto-update false
          if ($LASTEXITCODE -ne 0) { throw "retail set failed" }
          # Again over the running programs, as an update by hand does
          $p = Start-Process $inst -ArgumentList '--yes','--prefix',$dir,'--no-service','--no-autostart' -Wait -PassThru -RedirectStandardOutput again.txt
          Get-Content again.txt
          if ($p.ExitCode -ne 0) { throw "installing over the running programs: exit $($p.ExitCode)" }
          Get-ChildItem "$dir\bin"
          Stop-Process -Name retaild -Force

  # The server image (retaild and retail, no tunnel of its own) for
  # 64-bit Intel and ARM, from the same programs as the release
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          pattern: programs-linux-*
          merge-multiple: true
      - name: Programs by Docker platform
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            platform=${pair%%:*}; arch=${pair##*:}
            mkdir -p "image/$platform"
            for b in retaild retail; do cp "dist/$b-linux-$arch" "image/$platform/$b"; done
          done
          chmod 755 image/*/*
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          # No build-record artifact: it is not a release file
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

  # Everything the release holds, checked; created only for a tag
  publish:
    needs: [installers, macos, windows, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the installers (named after their system)
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          pattern: installers-*
          merge-multiple: true
      # VERSION lets daemons find the newest release through releases/latest/download/VERSION
      - run: |
          cd dist
          echo "${GITHUB_REF_NAME#v}" > VERSION
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          [ "$(ls | wc -l)" = 7 ] || { echo "expected 5 installers, VERSION and SHA256SUMS"; ls; exit 1; }
      - if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
